name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # MUST be an arm64 runner: the project only supports Apple silicon, and the
    # SwiftPM build targets the host architecture, so the runner arch is what gets tested.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        # Pinned: lint runs with -warnings-as-errors, so a runner image update
        # that adds a diagnostic would fail CI without a code change.
        run: sudo xcode-select -s /Applications/Xcode_16.3.app
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: make all
