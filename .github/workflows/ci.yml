name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # MUST be an arm64 runner: the Makefile hardcodes -target arm64-apple-macosx13.0,
    # so the x86_64 macos-13 runners would fail to link.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # Pinned: lint runs with -warnings-as-errors, so a runner image update
        # that adds a diagnostic would fail CI without a code change.
        run: sudo xcode-select -s /Applications/Xcode_16.3.app
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: make all
